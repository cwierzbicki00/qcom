[cfg]
erase = 2
skip_mode = 0x0, 0x0
boot2_isp_mode = 0

[boot2]
filedir = ./build/build_out/boot2_*.bin
address = 0x000000

[partition]
filedir = ./build/build_out/partition*.bin
address = 0xE000

[littlefs]
filedir = ./build/build_out/littlefs.bin
address = 0x378000

[FW]
filedir = ./build/build_out/spi_wifi*_$(CHIPNAME).bin
address = @partition

